# ============================================================
# Задание 10: CI/CD пайплайн с Docker и GitHub Actions
# Автоматическая сборка и публикация Docker-образа
# ============================================================
name: Docker Build and Push

on:
  push:
    branches: [main, master]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/docker-flask-app

jobs:
  # --- Job 1: Лinting и проверка ---
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- Job 2: Сборка и тестирование Docker-образа ---
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test container
        run: docker run --rm ${{ env.IMAGE_NAME }}:test-${{ github.sha }} python -c "from app import app; print('App imported successfully')"

  # --- Job 3: Публикация в Docker Hub ---
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Clean up old cache
        run: rm -rf /tmp/.buildx-cache
        if: always()

  # --- Job 4: Уведомление об успехе ---
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: push
    if: always() && github.event_name == 'push'
    steps:
      - name: Build status
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image: ${{ env.IMAGE_NAME }}:latest"
          echo "Commit SHA: ${{ github.sha }}"
