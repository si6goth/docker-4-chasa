# ============================================================
# Задание 9: Docker Swarm — файл для развёртывания стека
# Адаптированный docker-compose.yml для Swarm
# ============================================================
version: '3.8'

services:
  web:
    image: my-flask-app:latest
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=supersecretkey
      - DATABASE_URL=postgresql://dockeruser:dockerpass@db:5432/mydb
    networks:
      - frontend
      - backend
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dockeruser
      POSTGRES_PASSWORD: dockerpass
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
